#
# Track 0 baseline (T0.1 in docs/plan/01-T0-baseline.md): installs the exact
# versions of `constraints/baseline.txt` and runs the test suite, including
# the baseline tests (reference data, derivative status matrix). Pull
# requests and pushes skip the tests marked `large` or `slow`; the nightly run
# executes everything.
name: Tests (baseline constraints)

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "doc*/**"
      - "./*.ya?ml"
      - "**/*.md"
      - "**/*.rst"

  pull_request:
    paths-ignore:
      - "doc*/**"
      - "./*.ya?ml"
      - "**/*.md"
      - "**/*.rst"

  schedule:
    - cron: "17 2 * * *"

  workflow_dispatch:

jobs:
  main:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        shell: bash {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install from constraints
        run: |
          set -e
          python3 -m pip install --upgrade pip
          python3 -m pip install torch==2.14.0 \
            --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install -e ".[tox,libcint,pyscf]" \
            -c constraints/baseline.txt
          python3 -m pip freeze

      - name: Select tests
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || \
             [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "MARKERS=" >> "$GITHUB_ENV"
          else
            echo "MARKERS=not large and not slow" >> "$GITHUB_ENV"
          fi

      - name: Unittests
        run: |
          set -e
          python3 -m pytest -vv -m "${MARKERS}" -n logical \
            --dist worksteal --random-order-bucket=global \
            --durations=50 test
